<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>okast hls.js + WebTorrent P2P PoC</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; margin: 1.5rem; background: #14101f; color: #e8e6f0; }
      video { width: 640px; max-width: 100%; background: #000; border-radius: 6px; }
      h1 { font-size: 1.1rem; color: #b9a8ff; }
      #stats { margin-top: 1rem; font-family: ui-monospace, monospace; white-space: pre-wrap; }
      a { color: #6544e9; }
    </style>
  </head>
  <body>
    <h1>okast &mdash; hls.js + WebTorrent fragment loader (PoC)</h1>
    <video id="v" controls autoplay muted playsinline></video>
    <div id="stats">starting&hellip;</div>
    <p>
      hls.js plays the HLS playlist; media segments are fetched over WebTorrent
      (peers first, origin WebSeed fallback) by the custom fragment loader. Open a
      <b>second tab</b> to share segments peer-to-peer. Uses the P3X-118/webtorrent fork.
    </p>

    <!-- Relative srcs so this works under a path prefix (e.g. /p2p/) behind a
         reverse proxy as well as at the seeder root. -->
    <script src="lib/hls.min.js"></script>
    <script src="wt-hls-loader.js"></script>
    <!-- webtorrent.min.js is an ES module (exports a default), so it must be
         imported, not loaded via a plain <script> (which leaves WebTorrent
         undefined). hls.js + the loader are UMD globals and stay as scripts. -->
    <script type="module">
      import WebTorrent from './lib/webtorrent.min.js';
      const video = document.getElementById('v');
      const statsEl = document.getElementById('stats');
      // Default to okast's public HLS master playlist (same origin as the page);
      // override with ?src= for local PoC (e.g. ?src=/media/stream.m3u8).
      const SOURCE = new URLSearchParams(location.search).get('src') || '/hls/stream.m3u8';

      const metrics = { p2p: 0, origin: 0, fragments: 0, chunkSeconds: 0, reasons: {} };
      const byName = new Map(); // segment name -> manifest entry { magnet, ... }
      let trackers = [];
      let wt = null; // shared so refreshManifest can preload upcoming torrents

      // Pre-add an upcoming torrent so WebRTC handshake/peering happens in the
      // background well before hls.js demands the segment (it plays ~60s behind
      // the live edge, so the torrent matures during the previous segments).
      // Without this, per-segment peering can't finish inside the loader deadline.
      function preload(entry) {
        if (!wt || !entry || !entry.magnet) return;
        const magnet = entry.magnet.replace(/[&?]ws=[^&]+/g, '');
        Promise.resolve(wt.get(magnet))
          .then(existing => {
            if (!existing) wt.add(magnet, trackers ? { announce: trackers } : {});
          })
          .catch(() => {});
      }

      async function refreshManifest() {
        try {
          const m = await (await fetch('manifest.json')).json();
          trackers = m.trackers || [];
          metrics.chunkSeconds = m.chunkSeconds || 0;
          (m.live || []).forEach(e => {
            const isNew = !byName.has(e.name);
            byName.set(e.name, e);
            if (isNew) preload(e);
          });
        } catch (e) {
          /* keep last map */
        }
      }

      function start() {
        wt = new WebTorrent();
        // The initial refreshManifest ran before wt existed; preload any
        // entries we already know about now that we have a client.
        byName.forEach(preload);
        const onBytes = ({ p2p, origin, reason }) => {
          metrics.p2p += p2p || 0;
          metrics.origin += origin || 0;
          metrics.fragments += 1;
          if (reason) metrics.reasons[reason] = (metrics.reasons[reason] || 0) + 1;
        };
        const getEntry = name => byName.get(name) || null;

        const fLoader = window.createWebTorrentFragmentLoader({ wt, getEntry, trackers, onBytes });

        if (!window.Hls || !Hls.isSupported()) {
          statsEl.textContent = 'hls.js is not supported in this browser.';
          return;
        }
        const hls = new Hls({ fLoader, lowLatencyMode: false, backBufferLength: 30 });
        hls.on(Hls.Events.ERROR, (_e, data) => {
          if (data.fatal) statsEl.textContent = `hls.js fatal: ${data.type} / ${data.details}`;
        });
        hls.loadSource(SOURCE);
        hls.attachMedia(video);

        // Report deltas to okast's metrics endpoint (same origin) so the admin
        // P2P report can aggregate across viewers. Deltas avoid double-counting.
        const clientId = Math.random().toString(36).slice(2, 10);
        let lastP2p = 0;
        let lastOrigin = 0;
        setInterval(() => {
          const dP = metrics.p2p - lastP2p;
          const dO = metrics.origin - lastOrigin;
          lastP2p = metrics.p2p;
          lastOrigin = metrics.origin;
          const peers = wt.torrents.reduce((n, t) => n + t.numPeers, 0);
          fetch('/api/p2p/report', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            keepalive: true,
            body: JSON.stringify({ chunkSeconds: metrics.chunkSeconds, peers, p2pBytes: dP, originBytes: dO, clientId }),
          }).catch(() => {});
        }, 10000);

        setInterval(() => {
          const total = metrics.p2p + metrics.origin || 1;
          const peers = wt.torrents.reduce((n, t) => n + t.numPeers, 0);
          statsEl.textContent =
            `source          : ${SOURCE}\n` +
            `chunk seconds   : ${metrics.chunkSeconds}\n` +
            `peers (now)     : ${peers} across ${wt.torrents.length} torrents\n` +
            `fragments       : ${metrics.fragments}\n` +
            `manifest chunks : ${byName.size}\n` +
            `P2P bytes       : ${fmt(metrics.p2p)}  (${((metrics.p2p / total) * 100).toFixed(0)}%)\n` +
            `origin bytes    : ${fmt(metrics.origin)}  (${((metrics.origin / total) * 100).toFixed(0)}%)\n` +
            `reasons         : ${Object.entries(metrics.reasons).map(([k, v]) => `${k}:${v}`).join('  ') || '-'}\n` +
            `video time      : ${video.currentTime.toFixed(1)}s`;
        }, 1000);
      }

      const fmt = n => (n > 1e6 ? `${(n / 1e6).toFixed(1)}MB` : `${(n / 1e3).toFixed(0)}kB`);

      // Prime the manifest map, then start; keep refreshing for live edges.
      refreshManifest().then(start);
      setInterval(refreshManifest, 3000);
    </script>
  </body>
</html>
