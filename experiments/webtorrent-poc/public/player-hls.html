<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>okast P2P livestream (p2p-media-loader)</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; margin: 1.5rem; background: #14101f; color: #e8e6f0; }
      video { width: 640px; max-width: 100%; background: #000; border-radius: 6px; }
      h1 { font-size: 1.1rem; color: #b9a8ff; }
      #stats { margin-top: 1rem; font-family: ui-monospace, monospace; white-space: pre-wrap; }
      a { color: #6544e9; }
    </style>
  </head>
  <body>
    <h1>okast &mdash; hls.js + p2p-media-loader (production library)</h1>
    <video id="v" controls autoplay muted playsinline></video>
    <div id="stats">starting&hellip;</div>
    <p>
      hls.js plays the HLS playlist; segments are fetched over a persistent
      WebRTC peer mesh by <b>p2p-media-loader</b> (Novage, MIT). HTTP origin
      is always the fallback. Open a <b>second tab/device</b> to share segments.
    </p>

    <!-- hls.js UMD global -->
    <script src="lib/hls.min.js"></script>
    <!-- The hls.js plugin's ESM bundle imports 'p2p-media-loader-core' by bare
         specifier; resolve it to our vendored copy via an import map. -->
    <script type="importmap">
      {
        "imports": {
          "p2p-media-loader-core": "./lib/p2p-media-loader-core.es.min.js"
        }
      }
    </script>
    <script type="module">
      import { HlsJsP2PEngine } from './lib/p2p-media-loader-hlsjs.es.min.js';

      const video = document.getElementById('v');
      const statsEl = document.getElementById('stats');
      const SOURCE = new URLSearchParams(location.search).get('src') || '/hls/stream.m3u8';

      const metrics = { httpBytes: 0, p2pBytes: 0, peersConnected: 0, peers: new Set() };
      const reasons = {};
      const events = []; // ring buffer of recent hls.js events / errors
      const pushEvent = s => { events.push(`${new Date().toLocaleTimeString()} ${s}`); if (events.length > 8) events.shift(); };

      if (!window.Hls || !Hls.isSupported()) {
        statsEl.textContent = 'hls.js is not supported in this browser.';
      } else {
        const HlsWithP2P = HlsJsP2PEngine.injectMixin(Hls);
        const hls = new HlsWithP2P({
          // hls.js options
          debug: { trace:()=>{}, debug:()=>{}, log:()=>{}, warn:(...a)=>pushEvent('warn ' + a.join(' ').slice(0,120)), error:(...a)=>pushEvent('ERR ' + a.join(' ').slice(0,120)), info:()=>{} },
          lowLatencyMode: false,
          backBufferLength: 30,
          // NOTE: don't tighten liveSyncDurationCount on this stream. With a
          // 6-segment playlist (~120s window), the defaults already leave only
          // 3 segments of headroom, and going to 2 made hls.js race the
          // playlist rotation -- segments dropped out of the playlist mid-load
          // and stream-controller crashed with "Frag error: can't access
          // property frag, t is null" loops. The bufferStalledError handler
          // below is enough to recover from live-edge drift; tightening the
          // live window on top destabilized bootstrap.
          // p2p-media-loader options. Defaults are tuned for VOD; these
          // adjustments make P2P actually engage for LIVE HLS:
          //   - highDemandTimeWindow defaults to 15s (anything within that of
          //     playback gets HTTP-priority, with P2P aborted). For live with
          //     ~30s buffer ahead, every segment falls in that zone. Drop it.
          //   - httpDownloadInitialTimeoutMs defaults to 0 (no startup grace);
          //     synchronized viewers both race HTTP. Give P2P a window to
          //     discover the first peer to have a segment.
          //   - cachedSegmentsCount kept generous so this peer remains a
          //     provider after playing past a segment.
          p2p: {
            core: {
              // Single tracker. The library docs flag multi-tracker problems in
              // Safari (SDP signaling); Firefox can hit similar issues. Novage's
              // own tracker is the library author's reference deployment.
              announceTrackers: ['wss://tracker.novage.com.ua'],
              // Defaults tuned for live HLS. highDemandTimeWindow tighter than the
              // 15s default so segments >10s ahead are P2P-eligible (with default
              // 15s, every live-edge segment was HTTP-priority). httpDownloadInitialTimeoutMs
              // kept short so a browser can ALWAYS bootstrap via HTTP if no peer
              // is available in time -- larger values starved Firefox/Vivaldi on
              // first load when no peer existed yet.
              highDemandTimeWindow: 10,
              httpDownloadInitialTimeoutMs: 3000,
              cachedSegmentsCount: 50,
            },
          },
        });

        // The library exposes a typed event API on hls.p2pEngine.
        hls.p2pEngine.addEventListener('onChunkDownloaded', (bytes, source, peerId) => {
          if (source === 'p2p') {
            metrics.p2pBytes += bytes;
            const r = peerId ? `p2p:${peerId.slice(0, 6)}` : 'p2p';
            reasons[r] = (reasons[r] || 0) + 1;
          } else {
            metrics.httpBytes += bytes;
            reasons.http = (reasons.http || 0) + 1;
          }
        });
        hls.p2pEngine.addEventListener('onPeerConnect', d => {
          metrics.peers.add(d.peerId);
          metrics.peersConnected = metrics.peers.size;
        });
        hls.p2pEngine.addEventListener('onPeerClose', d => {
          metrics.peers.delete(d.peerId);
          metrics.peersConnected = metrics.peers.size;
        });
        hls.p2pEngine.addEventListener('onSegmentError', d => {
          const r = `seg-err:${d.errorType || 'unknown'}`;
          reasons[r] = (reasons[r] || 0) + 1;
        });

        hls.on(Hls.Events.ERROR, (_e, data) => {
          pushEvent(`${data.fatal ? 'FATAL' : 'err'} ${data.type}/${data.details}${data.reason ? ' ' + data.reason : ''}`);
          // Live-edge stall recovery: when the player runs out of buffer on a
          // live stream, hls.js's default nudge can't recover (there's nothing
          // to nudge into). Seek to the live edge so playback resumes from a
          // segment that actually exists in the current playlist.
          if (!data.fatal && data.details === 'bufferStalledError') {
            const target = hls.liveSyncPosition;
            if (target != null && Math.abs(target - video.currentTime) > 1) {
              pushEvent(`recover: seek ${video.currentTime.toFixed(1)} -> live ${target.toFixed(1)}`);
              video.currentTime = target;
            }
          }
        });
        // Surface stall + recover so we can tell whether the player is wedged
        // or just buffering.
        video.addEventListener('stalled', () => pushEvent('video:stalled'));
        video.addEventListener('waiting', () => pushEvent('video:waiting'));
        video.addEventListener('playing', () => pushEvent('video:playing'));
        video.addEventListener('pause',   () => pushEvent('video:pause'));
        video.addEventListener('ended',   () => pushEvent('video:ended'));
        hls.loadSource(SOURCE);
        hls.attachMedia(video);

        // Emit deltas to okast for the admin P2P report.
        const clientId = Math.random().toString(36).slice(2, 10);
        let lastP2p = 0;
        let lastOrigin = 0;
        setInterval(() => {
          const dP = metrics.p2pBytes - lastP2p;
          const dO = metrics.httpBytes - lastOrigin;
          lastP2p = metrics.p2pBytes;
          lastOrigin = metrics.httpBytes;
          fetch('/api/p2p/report', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            keepalive: true,
            body: JSON.stringify({
              chunkSeconds: 20,
              peers: metrics.peersConnected,
              p2pBytes: dP,
              originBytes: dO,
              clientId,
            }),
          }).catch(() => {});
        }, 10000);

        const fmtBuf = () => {
          const b = video.buffered; const out = [];
          for (let i = 0; i < b.length; i++) out.push(`${b.start(i).toFixed(1)}-${b.end(i).toFixed(1)}`);
          return out.join(',') || '(empty)';
        };
        const readyStates = ['HAVE_NOTHING','HAVE_METADATA','HAVE_CURRENT_DATA','HAVE_FUTURE_DATA','HAVE_ENOUGH_DATA'];
        setInterval(() => {
          const total = metrics.p2pBytes + metrics.httpBytes || 1;
          statsEl.textContent =
            `source          : ${SOURCE}\n` +
            `peers connected : ${metrics.peersConnected}\n` +
            `P2P bytes       : ${fmt(metrics.p2pBytes)}  (${((metrics.p2pBytes / total) * 100).toFixed(0)}%)\n` +
            `HTTP bytes      : ${fmt(metrics.httpBytes)}  (${((metrics.httpBytes / total) * 100).toFixed(0)}%)\n` +
            `chunks          : ${Object.entries(reasons).map(([k, v]) => `${k}:${v}`).join('  ') || '-'}\n` +
            `video time      : ${video.currentTime.toFixed(1)}s  paused=${video.paused} ready=${readyStates[video.readyState]}\n` +
            `buffered        : ${fmtBuf()}\n` +
            `events:\n  ${events.join('\n  ') || '(none)'}`;
        }, 1000);
      }

      const fmt = n => (n > 1e6 ? `${(n / 1e6).toFixed(1)}MB` : `${(n / 1e3).toFixed(0)}kB`);
    </script>
  </body>
</html>
